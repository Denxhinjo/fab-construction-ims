databases:
  - name: fab-ims-db
    databaseName: fab_construction_ims
    plan: free

services:
  # ─── FastAPI Backend ────────────────────────────────────────────────
  # Docker rather than the native Python runtime: reading scanned invoices
  # needs the tesseract-ocr system package, installed by backend/Dockerfile.
  - type: web
    name: fab-ims-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fab-ims-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://fab-ims-frontend.onrender.com

  # ─── React Frontend (Static Site) ──────────────────────────────────
  - type: web
    name: fab-ims-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fab-ims-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
