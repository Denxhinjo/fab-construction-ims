services:
  #this service is the fastapi backend
  #this uses docker instead of the python runtime because reading scanned invoices needs tesseract-ocr, installed by backend/Dockerfile
  #this leaves the frontend on vercel and the database on neon
  - type: web
    name: fab-ims-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    #this runs migrations on every deploy so the database always matches the code
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      #this is the neon connection string, entered in the render dashboard and never committed
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://ims-clean-exyj.vercel.app
