services:
  # ─── FastAPI Backend ────────────────────────────────────────────────
  # Docker rather than the native Python runtime: reading scanned invoices
  # needs the tesseract-ocr system package, installed by backend/Dockerfile.
  # The frontend stays on Vercel and the database on Neon.
  - type: web
    name: fab-ims-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Migrations run on every deploy, so the database always matches the code.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # The Neon connection string; entered in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://ims-clean-exyj.vercel.app
